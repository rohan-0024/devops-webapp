apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: blue }
  template:
    metadata:
      labels: { app: shop, version: blue }
    spec:
      containers:
        - name: app
          image: rohannn004/webapp:blue
          ports: [{ containerPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: green }
  template:
    metadata:
      labels: { app: shop, version: green }
    spec:
      containers:
        - name: app
          image: rohannn004/webapp:green
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: shop-svc
spec:
  selector:
    app: shop
    version: blue
  ports:
    - port: 80
      targetPort: 80
